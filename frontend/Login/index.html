<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: rgba(255, 255, 255, 0.94);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-soft: rgba(148, 163, 184, 0.28);
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --input-bg: #f8fafc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text-main);
      background:
        radial-gradient(circle at top left, rgba(59, 130, 246, 0.35), transparent 30%),
        radial-gradient(circle at bottom right, rgba(14, 165, 233, 0.2), transparent 28%),
        linear-gradient(135deg, #020617 0%, #0f172a 45%, #1e293b 100%);
    }

    .login-shell {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 24px;
      background: var(--card-bg);
      box-shadow: 0 28px 70px rgba(15, 23, 42, 0.35);
      overflow: hidden;
      backdrop-filter: blur(14px);
    }

    .login-card__hero {
      padding: 32px 32px 20px;
      background: linear-gradient(180deg, rgba(37, 99, 235, 0.12), rgba(255, 255, 255, 0));
    }

    .login-badge {
      display: inline-flex;
      align-items: center;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(37, 99, 235, 0.12);
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .login-title {
      margin: 18px 0 10px;
      font-size: 2rem;
      font-weight: 700;
      line-height: 1.15;
    }

    .login-text {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.98rem;
      line-height: 1.65;
    }

    .login-form {
      padding: 8px 32px 32px;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.94rem;
      font-weight: 600;
      color: #1e293b;
    }

    .form-control {
      width: 100%;
      height: 52px;
      border-radius: 14px;
      border: 1px solid var(--border-soft);
      background: var(--input-bg);
      padding: 0 16px;
      font-size: 0.97rem;
    }

    .btn-login {
      width: 100%;
      height: 52px;
      border: 0;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), #3b82f6);
      box-shadow: 0 18px 30px rgba(37, 99, 235, 0.24);
      cursor: pointer;
    }

    .notice {
      display: none;
      margin-bottom: 1.25rem;
      padding: 0.9rem 1rem;
      border-radius: 14px;
      background: #dbeafe;
      color: #1e40af;
      font-size: 0.93rem;
    }

    .notice.show {
      display: block;
    }

    .login-footer {
      margin-top: 18px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.88rem;
    }
  </style>
</head>
<body>
  <main class="login-shell">
    <section class="login-card">
      <div class="login-card__hero">
        <span class="login-badge">Admin Panel</span>
        <h1 class="login-title">Welcome back</h1>
        <p class="login-text">Sign in screen indi yalnız frontend demo komponentidir.</p>
      </div>

      <div class="login-form">
        <div class="notice" id="loginNotice">Backend login silinib. Bu forma yalnız UI demo kimi saxlanılıb.</div>

        <form id="loginForm">
          <div class="form-group">
            <label class="form-label" for="email">Email address</label>
            <input name="email" type="email" class="form-control" id="email" placeholder="admin@example.com" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input name="password" type="password" class="form-control" id="password" placeholder="Enter your password" required>
          </div>
          <button type="submit" class="btn-login">Login</button>
        </form>

        <p class="login-footer">Secure access layout preserved for frontend presentation.</p>
      </div>
    </section>
  </main>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function (event) {
      event.preventDefault();
      document.getElementById('loginNotice').classList.add('show');
    });
  </script>
</body>
</html>
